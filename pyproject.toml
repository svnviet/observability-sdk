[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obskit"
version = "0.1.0"
description = "Obskit SDK: identity, context propagation, workflow tracking, reliable event transport."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0"]  # the only runtime dependency; the SDK stays lightweight

[project.optional-dependencies]
# Both are optional so the base SDK stays light; features switch on when the libraries are installed.
otel = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]
metrics = ["prometheus-client>=0.20,<1"]
dev = [
  "obskit[otel,metrics]",
  "sqlalchemy>=2,<2.1",
  "pytest>=8,<9",
  "ruff>=0.6,<1.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by `ruff format`
