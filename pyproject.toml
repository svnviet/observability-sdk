[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svn-obskit"
version = "0.3.0"
description = "Instrumentation SDK for services that report to observability-platform: workflow tracking, worker heartbeats, resilience, OpenTelemetry spans and Prometheus metrics."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "svnviet"}]
keywords = ["observability", "workflow", "tracing", "opentelemetry", "prometheus", "heartbeat", "resilience"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
  "Framework :: FastAPI",
]
dependencies = ["httpx>=0.27,<1.0"]  # the only runtime dependency; the SDK stays lightweight

[project.scripts]
obskit = "svn_obskit.cli:main"

[project.urls]
Homepage = "https://github.com/svnviet/observability-sdk"
Source = "https://github.com/svnviet/observability-sdk"
Issues = "https://github.com/svnviet/observability-sdk/issues"

[project.optional-dependencies]
# Both are optional so the base SDK stays light; features switch on when the libraries are installed.
otel = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]
metrics = ["prometheus-client>=0.20,<1"]
dev = [
  "svn-obskit[otel,metrics]",
  "sqlalchemy>=2,<2.1",
  "pytest>=8,<9",
  "ruff>=0.6,<1.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The Claude skill that `obskit init-claude` copies into a service repo.
svn_obskit = ["agent_skill/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by `ruff format`
